# @package _global_
module:
  _target_: emg2qwerty.lightning.HybridCTCModule
  in_features: null
  mlp_features: [192,192] #prev  [192]
  block_channels: [24, 24, 24, 24]
  kernel_width: 32
  hidden_size: 192 #prev 128
  num_layers: 4
  dropout: 0.1
  bidirectional: true
  n_fft: ${logspec.n_fft}
  channel_indices: ${channel_subset.channel_indices}
  optimizer:
    _target_: torch.optim.Adam
    lr: 0.0003
  lr_scheduler:
    scheduler:
      _target_: pl_bolts.optimizers.lr_scheduler.LinearWarmupCosineAnnealingLR
      warmup_epochs: 0
      max_epochs: ${trainer.max_epochs}
      warmup_start_lr: 0.0003
      eta_min: 1.0e-06
    interval: epoch
  decoder:
    _target_: emg2qwerty.decoder.CTCGreedyDecoder

datamodule:
  _target_: emg2qwerty.lightning.WindowedEMGDataModule
  window_length: 8000
  padding: [1800, 200]

trainer:
  gradient_clip_val: 1.0
