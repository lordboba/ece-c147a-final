# @package _global_
module:
  _target_: emg2qwerty.lightning.GRUCTCModule
  in_features: 528
  mlp_features: [384]
  hidden_size: 256
  num_layers: 4
  dropout: 0.1
  bidirectional: true
  optimizer:
    _target_: torch.optim.Adam
    lr: 0.0003
  lr_scheduler:
    scheduler:
      _target_: pl_bolts.optimizers.lr_scheduler.LinearWarmupCosineAnnealingLR
      warmup_epochs: 10
      max_epochs: ${trainer.max_epochs}
      warmup_start_lr: 1.0e-08
      eta_min: 1.0e-06
    interval: epoch
  decoder:
    _target_: emg2qwerty.decoder.CTCGreedyDecoder

datamodule:
  _target_: emg2qwerty.lightning.WindowedEMGDataModule
  window_length: 8000
  padding: [1800, 200]
