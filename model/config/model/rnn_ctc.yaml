# @package _global_
module:
  _target_: emg2qwerty.lightning.RNNCTCModule
  in_features: 528
  mlp_features: [256]
  hidden_size: 128
  num_layers: 2
  dropout: 0.2
  bidirectional: true
  optimizer:
    _target_: torch.optim.Adam
    lr: 0.0001
  lr_scheduler:
    scheduler:
      _target_: pl_bolts.optimizers.lr_scheduler.LinearWarmupCosineAnnealingLR
      warmup_epochs: 0
      max_epochs: ${trainer.max_epochs}
      warmup_start_lr: 0.0003
      eta_min: 1.0e-06
    interval: epoch
  decoder:
    _target_: emg2qwerty.decoder.CTCGreedyDecoder

datamodule:
  _target_: emg2qwerty.lightning.WindowedEMGDataModule
  window_length: 8000
  padding: [1800, 200]

trainer:
  gradient_clip_val: 1.0
